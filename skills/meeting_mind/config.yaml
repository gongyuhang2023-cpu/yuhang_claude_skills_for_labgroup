# MeetingMind 配置
# output.base_dir 首次使用时由 Claude 自动填写，之后不再询问

output:
  base_dir: ""  # 首次使用时由 Claude 填写，建议直接设为 wiki raw 路径

defaults:
  meeting: "teams"
  interval: 5.0
  threshold: 5.0

audio:
  virtual_cable:
    enabled: true
    keyword: "CABLE Input"

transcription:
  engine: "qwen3-asr-local"
  model: "Qwen/Qwen3-ASR-1.7B"
  device: "cuda:0"
  vocabulary: "~/.claude/skills/meeting_mind/vocabulary.txt"
